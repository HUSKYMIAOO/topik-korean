const key="topik-vocab-v1";let prog=JSON.parse(localStorage.getItem(key)||'{"known":[],"review":[]}');function save(){localStorage.setItem(key,JSON.stringify(prog))}

let speechTimer=null;function speak(t,slow=false){if(!window.speechSynthesis||!window.SpeechSynthesisUtterance){alert("このブラウザは音声読み上げに対応していません。Safariで開いてください。");return}const synth=window.speechSynthesis;try{if(speechTimer)clearTimeout(speechTimer);synth.cancel();const u=new SpeechSynthesisUtterance(String(t));u.lang="ko-KR";u.rate=slow?0.7:0.95;u.pitch=1;u.volume=1;const voices=synth.getVoices();const ko=voices.find(v=>v.lang.toLowerCase()==="ko-kr")||voices.find(v=>v.lang.toLowerCase().startsWith("ko"));if(ko)u.voice=ko;u.onerror=e=>{if(e.error!=="canceled"&&e.error!=="interrupted")showSpeechNotice("音声を再生できませんでした。iPhoneの設定 → アクセシビリティ → 読み上げコンテンツ → 声で韓国語の音声を確認してください。")};u.onstart=()=>{const n=document.getElementById("speech-notice");if(n)n.remove()};synth.speak(u);if(synth.paused)synth.resume();speechTimer=setTimeout(()=>{if(synth.paused)synth.resume();if(!synth.speaking&&!synth.pending)showSpeechNotice("音声が再生されません。iPhoneの消音設定・音量と韓国語音声のインストールを確認してください。")},1300)}catch(e){showSpeechNotice("音声再生エラー：Safariで開いて、韓国語の音声設定を確認してください。")}}function showSpeechNotice(t){let n=document.getElementById("speech-notice");if(!n){n=document.createElement("div");n.id="speech-notice";n.style.cssText="position:fixed;top:8px;left:10px;right:10px;z-index:9999;background:#fff2d6;color:#654100;border:1px solid #dfbd77;border-radius:12px;padding:14px;box-shadow:0 3px 15px #0002;font-size:14px";document.body.appendChild(n)}n.textContent=t;n.onclick=()=>n.remove();setTimeout(()=>{if(n.isConnected)n.remove()},10000)}
function filtered(){return words.filter(w=>(category==="すべて"||w.cat===category)&&(!search||[w.ko,w.ja,w.zh].some(t=>t.toLowerCase().includes(search.toLowerCase()))))}

function randomCard(){index=Math.floor(Math.random()*filtered().length);render()}function mark(k,known){prog.known=prog.known.filter(x=>x!==k);prog.review=prog.review.filter(x=>x!==k);(known?prog.known:prog.review).push(k);save();index++;render()}

function shuffle(a){return a.sort(()=>Math.random()-.5)}function begin(){let arr=filtered();if(view==="review")arr=arr.filter(w=>prog.review.includes(w.ko));if(arr.length<4){alert("4語以上あるカテゴリーを選んでください");return}quiz=shuffle([...arr]).slice(0,Math.min(20,arr.length));qi=0;score=0;drawQuiz()}

function answer(choice){if(locked)return;locked=true;let w=quiz[qi],ok=choice===w.ko;if(ok){score++;prog.known=Array.from(new Set([...prog.known,w.ko]));prog.review=prog.review.filter(x=>x!==w.ko)}else{prog.review=Array.from(new Set([...prog.review,w.ko]));prog.known=prog.known.filter(x=>x!==w.ko)}save();document.querySelectorAll("#answers button").forEach(b=>{b.disabled=true;if(b.textContent===w.ja)b.classList.add("correct");else if(b.textContent===words.find(x=>x.ko===choice)?.ja)b.classList.add("wrong")});document.getElementById("feedback").innerHTML='<p><b>'+(ok?"✅ 正解！":"❌ 不正解")+'</b> '+esc(w.ko)+' = '+esc(w.ja)+' / '+esc(w.zh)+'</p><button class="primary" onclick="qi++;drawQuiz()">次の問題 →</button>'}
