<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#4654b8"><title>初級韓国語 単語・生詞帳</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:#f5f6ff;color:#222747}*{box-sizing:border-box}body{margin:0}header{background:#4654b8;color:white;padding:20px 16px}h1{font-size:22px;margin:0}main{max-width:740px;margin:auto;padding:14px 14px 80px}.card{background:white;border-radius:17px;padding:16px;margin:12px 0;box-shadow:0 3px 14px #24306a10}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,select,input{font:inherit;border-radius:11px;padding:10px;border:1px solid #d7daf0}button{background:#e9edff;color:#293b9d;cursor:pointer}a{color:#293b9d}.pill{display:inline-block;background:#edf0ff;padding:3px 8px;border-radius:10px;font-size:12px}.word{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid #eee;padding:12px 0}.word:last-child{border:0}.muted{color:#737b92;font-size:13px}.ko{font-size:21px;font-weight:700}input{width:100%;margin:10px 0}select{max-width:100%}.active{background:#4654b8;color:white}.toolbar{display:flex;gap:7px;flex-wrap:wrap}.small{font-size:12px}</style></head><body><header><h1>📖 初級韓国語 単語・生詞帳</h1><p style="margin-bottom:0">初級の学習用語彙 · 🇯🇵 日本語 / 🇨🇳 中文</p></header><main><div class="card"><div class="row"><a href="./index.html">🏠 文法ホーム</a><a href="./vocab.html">🗂️ 単語カード</a></div><p id="summary"></p><p class="muted">韓国国立国語院『韓国語基礎辞典』の初級語彙2,545語を収録。</p><input id="search" placeholder="韓国語・日本語・中文で検索" oninput="draw()"><p class="muted" id="importStatus">公式初級2,545語をサーバーから自動読み込み中です。</p><div class="toolbar"><button id="all" onclick="setMode('all')">全単語</button><button id="unknown" onclick="setMode('unknown')">⭐ 生詞帳</button></div></div><div class="card"><div id="list"></div></div></main><script src="./lexicon.js"></script><script>let official=[];fetch("./official-beginner.json?v=17",{cache:"no-store"}).then(r=>{if(!r.ok)throw Error("HTTP "+r.status);return r.json()}).then(a=>{if(!Array.isArray(a)||a.length!==2545)throw Error("Unexpected entry count");official=a;draw();document.getElementById("importStatus").textContent="✅ 公式初級語彙 "+a.length+" 語を読み込みました。"}).catch(e=>{document.getElementById("importStatus").textContent="⚠️ 公式語彙の読み込みに失敗しました: "+e.message});let mode=new URLSearchParams(location.search).get("view")==="unknown"?"unknown":"all";const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));function setMode(v){mode=v;draw()}function toggle(ko){topikBookToggle(ko);draw()}function draw(){const book=topikBookRead(),query=document.getElementById("search").value.trim().toLowerCase();const all=official.length?official:(window.TOPIK_LEXICON||[]);let list=all.filter(w=>(mode!=="unknown"||book[w.ko])&&(!query||[w.ko,w.ja,w.zh].some(x=>x.toLowerCase().includes(query))));document.getElementById("summary").textContent="収録 "+all.length+" 語 · 生詞帳 "+Object.keys(book).length+" 語";for(const m of ["all","unknown"])document.getElementById(m).classList.toggle("active",mode===m);document.getElementById("list").innerHTML=list.length?list.map(w=>'<div class="word"><div><span class="ko">'+esc(w.ko)+'</span><div>🇯🇵 '+esc(w.ja)+' · 🇨🇳 '+esc(w.zh)+'</div><div class="muted">'+esc(w.cat)+'</div></div><button onclick="toggle('+JSON.stringify(w.ko).replace(/"/g,"&quot;")+')">'+(book[w.ko]?"✓ 生詞帳から外す":"⭐ 生詞帳に追加")+'</button></div>').join(""):'<p class="muted">該当する単語はありません。</p>'}draw();if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});</script></body></html>
