<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#4654b8"><link rel="manifest" href="manifest.webmanifest"><title>TOPIK I 文法コーチ</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;color:#222747;background:#f5f6ff}*{box-sizing:border-box}body{margin:0}header{background:#4654b8;color:white;padding:20px 18px 16px}h1{margin:0;font-size:23px}small{opacity:.8}main{max-width:750px;margin:auto;padding:14px 14px 95px}.card{background:white;border-radius:18px;padding:17px;margin:12px 0;box-shadow:0 3px 14px #24306a10}h2{font-size:19px;margin:0 0 10px}h3{font-size:16px}.muted{color:#69718b}.ko{font-size:25px;font-weight:650;line-height:1.5;word-break:keep-all}.kana{color:#53629c}.zh{color:#7b8199}.rule{background:#edf0ff;border-radius:10px;padding:12px;line-height:1.7}button,select{font:inherit}button{border:0;border-radius:12px;padding:11px 14px;background:#e9edff;color:#293b9d;cursor:pointer}button.primary{background:#4654b8;color:white}button:disabled{opacity:.55}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.list{display:grid;gap:9px}.list button{text-align:left;background:#f4f5ff}.tabs{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #e0e3f0;display:flex;justify-content:space-around;padding:8px 4px max(10px,env(safe-area-inset-bottom))}.tabs button{background:transparent;font-size:13px;padding:8px 7px}.answer{width:100%;text-align:left;margin:5px 0;padding:14px;background:#f2f4ff}.correct{background:#d8f6e7!important;color:#176342}.wrong{background:#ffe2e2!important;color:#a32430}.pill{display:inline-block;background:#f0f1fc;border-radius:8px;padding:6px 9px;margin:3px}.stat{font-size:30px;font-weight:700;color:#4654b8}.sp{height:8px}select{padding:10px;border-radius:10px;border:1px solid #cbd0e7;background:white}</style></head><body><header><h1>🇰🇷 TOPIK I 文法コーチ</h1><small>日本語で韓国語を学ぶ · 中文辅助 · 音声付き</small></header><main id="app"></main><nav class="tabs"><button onclick="home()">🏠 ホーム</button><button onclick="lessons()">📚 文法</button><button onclick="setup()">📝 練習</button><button onclick="stats()">📊 記録</button></nav><script>
const raw=[
["이에요 / 예요","です","パッチムあり：이에요 ／ なし：예요","학생이에요.","学生です。","是学生。","학생이에요|의사예요|친구예요"],
["입니다","です（フォーマル）","名詞＋입니다","저는 학생입니다.","私は学生です。","我是学生。","학생입니다|선생님입니다|중국인입니다"],
["은 / 는","は","パッチムあり：은 ／ なし：는","저는 중국인이에요.","私は中国人です。","我是中国人。","저는|학생은|친구는"],
["이 / 가","が","パッチムあり：이 ／ なし：가","비가 와요.","雨が降ります。","下雨。","비가|학생이|제가"],
["을 / 를","を","パッチムあり：을 ／ なし：를","물을 마셔요.","水を飲みます。","喝水。","물을|커피를|한국어를"],
["에","に（場所・時間）","行き先・存在する場所・時刻","학교에 가요.","学校に行きます。","去学校。","학교에|집에|세 시에"],
["에서","で（場所）","動作する場所には 에서","학교에서 공부해요.","学校で勉強します。","在学校学习。","학교에서|집에서|도서관에서"],
["있어요","あります・います","存在・所有を表します","시간이 있어요.","時間があります。","有时间。","시간이 있어요|친구가 있어요"],
["없어요","ありません・いません","存在・所有の否定","시간이 없어요.","時間がありません。","没有时间。","시간이 없어요|돈이 없어요"],
["-아요 / -어요","ます","語幹の母音により活用","책을 읽어요.","本を読みます。","读书。","읽어요|먹어요|가요"],
["-해요","します","하다動詞の丁寧形","한국어를 공부해요.","韓国語を勉強します。","学习韩语。","공부해요|운동해요|일해요"],
["안","～ない","動詞・形容詞の前に置く否定","오늘 안 가요.","今日は行きません。","今天不去。","안 가요|안 먹어요|안 해요"],
["-지 않아요","～ません","語幹＋지 않아요","고기를 먹지 않아요.","肉を食べません。","不吃肉。","먹지 않아요|가지 않아요"],
["-았어요 / -었어요","～ました","過去形を作る","어제 영화를 봤어요.","昨日映画を見ました。","昨天看了电影。","봤어요|먹었어요|갔어요"],
["-(으)ㄹ 거예요","～つもりです","予定・未来を表す","내일 갈 거예요.","明日行くつもりです。","明天打算去。","갈 거예요|먹을 거예요"],
["-고 싶어요","～たいです","願望を表す","한국에 가고 싶어요.","韓国に行きたいです。","想去韩国。","가고 싶어요|먹고 싶어요"],
["-(으)세요","～てください","丁寧な依頼","여기 앉으세요.","ここに座ってください。","请坐这里。","앉으세요|가세요|읽으세요"],
["-아/어 주세요","～てください","相手に行動を依頼","도와주세요.","手伝ってください。","请帮忙。","도와주세요|기다려 주세요"],
["-(으)ㄹ 수 있어요","～ことができます","可能・能力を表す","한국어를 읽을 수 있어요.","韓国語が読めます。","会读韩语。","읽을 수 있어요|갈 수 있어요"],
["-고","～て・そして","動作・状態を並列する","밥을 먹고 공부해요.","ご飯を食べて勉強します。","吃饭后学习。","먹고|가고|읽고"],
["-지만","～けれども","逆接を表す","비싸지만 좋아요.","高いですが、いいです。","虽然贵但是好。","비싸지만|좋지만"],
["-아/어서","～ので・～て","理由や順序を表す","배가 아파서 쉬어요.","お腹が痛いので休みます。","肚子疼所以休息。","아파서|먹어서|가서"],
["-(으)니까","～から","理由を表す","추우니까 문을 닫아요.","寒いのでドアを閉めます。","因为冷所以关门。","추우니까|바쁘니까"],
["-(으)면","～たら・～なら","条件を表す","시간이 있으면 가요.","時間があれば行きます。","有时间就去。","있으면|가면|먹으면"],
["-기 전에","～前に","動作の前を表す","자기 전에 책을 읽어요.","寝る前に本を読みます。","睡前读书。","자기 전에|먹기 전에"],
["-(으)ㄴ 후에","～た後で","動作の後を表す","밥을 먹은 후에 가요.","食べた後で行きます。","吃饭后去。","먹은 후에|간 후에"],
["-부터 / -까지","～から／～まで","時間・範囲の起点と終点","아홉 시부터 공부해요.","9時から勉強します。","从九点开始学习。","아홉 시부터|다섯 시까지"],
["-하고","～と","名詞をつなぐ","친구하고 가요.","友達と行きます。","和朋友一起去。","친구하고|엄마하고"],
["-보다","～より","比較の基準を表す","오늘은 어제보다 추워요.","今日は昨日より寒いです。","今天比昨天冷。","어제보다|저보다"],
["-아/어도 돼요","～てもいいです","許可を表す","여기 앉아도 돼요.","ここに座ってもいいです。","可以坐这里。","앉아도 돼요|먹어도 돼요"],
["-(으)면 안 돼요","～てはいけません","禁止を表す","여기에서 먹으면 안 돼요.","ここで食べてはいけません。","这里不能吃东西。","먹으면 안 돼요|가면 안 돼요"],
["-아/어야 해요","～なければなりません","義務・必要を表す","공부해야 해요.","勉強しなければなりません。","必须学习。","공부해야 해요|가야 해요"],
["-는 것","～こと","動詞を名詞化する","책 읽는 것을 좋아해요.","本を読むことが好きです。","喜欢读书。","읽는 것|먹는 것"],
["-고 있어요","～ています","進行中の動作","지금 공부하고 있어요.","今勉強しています。","现在正在学习。","공부하고 있어요|먹고 있어요"],
["-(으)러 가요","～しに行きます","移動の目的を表す","밥을 먹으러 가요.","ご飯を食べに行きます。","去吃饭。","먹으러 가요|보러 가요"],
["-거나","～たり・または","選択肢を並べる","책을 읽거나 음악을 들어요.","本を読んだり音楽を聞いたりします。","读书或者听音乐。","읽거나|먹거나"],
["-(으)ㄹ 때","～とき","時を表す","시간이 있을 때 가요.","時間があるとき行きます。","有时间的时候去。","있을 때|갈 때"],
["-(으)ㄴ / 는","～する（連体形）","名詞を修飾する","제가 읽는 책이에요.","私が読んでいる本です。","是我正在读的书。","읽는 책|예쁜 꽃"],
["-네요","～ですね","気づき・感嘆","날씨가 좋네요.","天気がいいですね。","天气真好。","좋네요|맛있네요"],
["-겠어요","～でしょう・～します","推量・意志を表す","맛있겠어요.","おいしそうですね。","看起来很好吃。","맛있겠어요|알겠어요"]
];
const data=raw.map((x,i)=>({id:i+1,title:x[0],ja:x[1],rule:x[2],ko:x[3],j:x[4],zh:x[5],words:x[6].split("|")}));
const $=s=>document.querySelector(s);let state=JSON.parse(localStorage.getItem("topik-progress")||'{"done":[],"attempts":0,"correct":0,"mistakes":[]}'),quiz=[],pos=0,answered=false,fromLesson=null;
function save(){localStorage.setItem("topik-progress",JSON.stringify(state))}function speak(t,slow=false){if(!("speechSynthesis" in window)){alert("音声合成に対応していません");return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="ko-KR";u.rate=slow?.65:.9;speechSynthesis.speak(u)}
function shell(s){$("#app").innerHTML=s;scrollTo(0,0)}function home(){shell('<div class="card"><h2>안녕하세요! 👋</h2><p>日本語の文法と比べながら、韓国語 TOPIK I の基礎を学びましょう。</p><p class="zh">中文辅助：学习语法、听发音、反复刷题，记录保存在本机。</p><div class="row"><button class="primary" onclick="lessons()">📚 文法を学ぶ</button><button onclick="setup()">📝 練習する</button></div></div><div class="card"><h2>学習状況</h2><div class="row"><div><span class="stat">'+state.done.length+'</span> / '+data.length+' 文法</div><div><span class="stat">'+state.attempts+'</span> 回答</div></div></div><div class="card"><h2>🔊 発音のヒント</h2><p>文と単語の🔊を押すと韓国語で読み上げます。音声は端末の韓国語音声に依存します。</p><p class="muted">カタカナは韓国語の発音を正確には表せません。耳で聞いて練習しましょう。</p></div>')}
function lessons(){shell('<div class="card"><h2>📚 文法 '+data.length+' 項目</h2><p class="muted">TOPIK I の基礎文法を学習できます。</p><div class="list">'+data.map(x=>'<button onclick="lesson('+x.id+')">'+(state.done.includes(x.id)?"✅":"📖")+' '+x.id+'. '+x.title+' <span class="muted">— '+x.ja+'</span></button>').join("")+'</div></div>')}
function lesson(id){let x=data[id-1];shell('<div class="card"><div class="muted">文法 '+id+' / '+data.length+'</div><h2>'+x.title+' <small>'+x.ja+'</small></h2><div class="rule">'+x.rule+'</div><h3>例文</h3><div class="ko">'+x.ko+'</div><div class="row"><button onclick="speak('+JSON.stringify(x.ko)+')">🔊 文を読む</button><button onclick="speak('+JSON.stringify(x.ko)+',true)">🐢 ゆっくり</button></div><p>🇯🇵 '+x.j+'</p><p class="zh">🇨🇳 '+x.zh+'</p><h3>単語・表現の発音</h3><div class="row">'+x.words.map(w=>'<button onclick="speak('+JSON.stringify(w)+')">🔊 '+w+'</button>').join("")+'</div><div class="sp"></div><div class="row"><button class="primary" onclick="mark('+id+')">'+(state.done.includes(id)?"✓ 学習済み":"✓ 学習済みにする")+'</button><button onclick="startQuiz(10,'+id+')">この文法を練習</button></div></div><div class="row"><button onclick="lessons()">← 一覧</button>'+(id<data.length?'<button onclick="lesson('+(id+1)+')">次へ →</button>':'')+'</div>')}
function mark(id){if(!state.done.includes(id))state.done.push(id);save();lesson(id)}
function setup(){shell('<div class="card"><h2>📝 反復練習</h2><p>毎回問題・選択肢をシャッフルします。何度でも練習できます。</p><label>問題数 <select id="count"><option>10</option><option selected>20</option><option>30</option><option>50</option><option>100</option></select></label><div class="sp"></div><div class="row"><button class="primary" onclick="startQuiz(Number(\x27\x27+document.getElementById(\x27count\x27).value))">全範囲ランダム</button><button onclick="startQuiz(Number(document.getElementById(\x27count\x27).value),null,true)">❌ 間違い復習</button></div></div>')}
function shuffle(a){return a.sort(()=>Math.random()-.5)}function makeQ(x){let mode=Math.floor(Math.random()*3),other=shuffle(data.filter(v=>v.id!==x.id)).slice(0,3),prompt,correct,choices;if(mode===0){prompt='次の文の日本語訳は？\n'+x.ko;correct=x.j;choices=shuffle([correct,...other.map(v=>v.j)])}else if(mode===1){prompt='「'+x.j+'」に合う韓国語は？';correct=x.ko;choices=shuffle([correct,...other.map(v=>v.ko)])}else{prompt='次の文法の意味は？\n'+x.title;correct=x.ja;choices=shuffle([correct,...other.map(v=>v.ja)])}return {x,prompt,correct,choices}}
function startQuiz(n=20,id=null,wrong=false){let pool=id?[data[id-1]]:wrong?data.filter(x=>state.mistakes.includes(x.id)):data;if(!pool.length){alert("復習する間違いはありません。");return}quiz=Array.from({length:n},()=>makeQ(pool[Math.floor(Math.random()*pool.length)]));pos=0;fromLesson=id;renderQ()}
function renderQ(){answered=false;if(pos>=quiz.length){shell('<div class="card"><h2>🎉 お疲れさまでした！</h2><p>今回の練習が終わりました。</p><div class="row"><button class="primary" onclick="startQuiz('+quiz.length+','+fromLesson+')">🔁 もう一度</button><button onclick="setup()">別の練習</button></div></div>');return}let q=quiz[pos];shell('<div class="card"><p class="muted">問題 '+(pos+1)+' / '+quiz.length+'</p><h2 style="white-space:pre-line">'+q.prompt+'</h2><div class="row"><button onclick="speak('+JSON.stringify(q.x.ko)+')">🔊 例文</button><button onclick="speak('+JSON.stringify(q.x.ko)+',true)">🐢 遅く</button></div><div class="sp"></div><div id="options">'+q.choices.map((c,i)=>'<button class="answer" onclick="answer('+i+')">'+String.fromCharCode(65+i)+'. '+c+'</button>').join("")+'</div><div id="feedback"></div></div>')}
function answer(i){if(answered)return;answered=true;let q=quiz[pos],ok=q.choices[i]===q.correct;state.attempts++;if(ok)state.correct++;else if(!state.mistakes.includes(q.x.id))state.mistakes.push(q.x.id);else{}if(ok)state.mistakes=state.mistakes.filter(id=>id!==q.x.id);save();document.querySelectorAll(".answer").forEach((b,j)=>{b.disabled=true;if(q.choices[j]===q.correct)b.classList.add("correct");else if(j===i)b.classList.add("wrong")});$("#feedback").innerHTML='<p><b>'+(ok?"✅ 正解！":"❌ 不正解")+'</b></p><p>正解：'+q.correct+'</p><p class="rule">'+q.x.rule+'</p><p class="zh">中文：'+q.x.zh+'</p><button class="primary" onclick="pos++;renderQ()">次の問題 →</button>'}
function stats(){shell('<div class="card"><h2>📊 学習記録</h2><p>学習済み：<b>'+state.done.length+'/'+data.length+'</b></p><p>回答数：<b>'+state.attempts+'</b></p><p>正答率：<b>'+(state.attempts?Math.round(state.correct/state.attempts*100):0)+'%</b></p><p>復習対象：<b>'+state.mistakes.length+'</b></p><div class="row"><button onclick="startQuiz(20,null,true)">❌ 間違いを復習</button><button onclick="exportData()">📤 記録を保存</button></div></div><div class="card"><h3>データ管理</h3><p class="muted">記録はこのブラウザ内に保存されます。Safariのデータ削除で消える場合があります。</p><input type="file" accept="application/json" onchange="importData(event)"><div class="sp"></div><button onclick="if(confirm(\x27記録を消去しますか？\x27)){localStorage.removeItem(\x27topik-progress\x27);location.reload()}">記録をリセット</button></div>')}
function exportData(){let a=document.createElement("a"),b=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});a.href=URL.createObjectURL(b);a.download="topik-progress.json";a.click();URL.revokeObjectURL(a.href)}
function importData(e){let f=e.target.files[0];if(!f)return;f.text().then(t=>{try{let o=JSON.parse(t);if(!Array.isArray(o.done)||!Array.isArray(o.mistakes))throw Error();state=o;save();stats()}catch{alert("読み込めませんでした")}})}
if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});home();
</script></body></html>
