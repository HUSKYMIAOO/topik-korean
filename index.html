声付き</small></header><main id="app"></main><nav class="tabs"><button onclick="home()">🏠 ホーム</button><button onclick="lessons()">📚 文法</button><a href="./vocab.html" style="display:inline-flex;align-items:center;justify-content:center;color:#293b9d;text-decoration:none;font-size:13px;padding:8px 7px">🗂️ 単語</a><button onclick="setup()">📝 練習</button><button onclick="stats()">📊 記録</button></nav><script>
const raw=[

["을 / 를","を","パッチムあり：을 ／ なし：를","물을 마셔요.","水を飲みます。","喝水。","물을|커피를|한국어를"],
["에","に（場所・時間）","行き先・存在する場所・時刻","학교에 가요.","学校に行きます。","去学校。","학교에|집에|세 시에"],

["-(으)ㄴ 후에","～た後で","動作の後を表す","밥을 먹은 후에 가요.","食べた後で行きます。","吃饭后去。","먹은 후에|간 후에"],
["-부터 / -까지","～から／～まで","時間・範囲の起点と終点","아홉 시부터 공부해요.","9時から勉強します。","从九点开始学习。","아홉 시부터|다섯 시까지"],
["-하고","～と","名詞をつなぐ","친구하고 가요.","友達と行きます。","和朋友一起去。","친구하고|엄마하고"],
["-보다","～より","比較の基準を表す","오늘은 어제보다 추워요.","今日は昨日より寒いです。","今天比昨天冷。","어제보다|저보다"],

["-(으)ㄴ / 는","～する（連体形）","名詞を修飾する","제가 읽는 책이에요.","私が読んでいる本です。","是我正在读的书。","읽는 책|예쁜 꽃"],
["-네요","～ですね","気づき・感嘆","날씨가 좋네요.","天気がいいですね。","天气真好。","좋네요|맛있네요"],
["-겠어요","～でしょう・～します","推量・意志を表す","맛있겠어요.","おいしそうですね。","看起来很好吃。","맛있겠어요|알겠어요"]

const data=raw.map((x,i)=>({id:i+1,title:x[0],ja:x[1],rule:x[2],ko:x[3],j:x[4],zh:x[5],words:x[6].split("|")}));
const $=s=>document.querySelector(s);let state=JSON.parse(localStorage.getItem("topik-progress")||'{"done":[],"attempts":0,"correct":0,"mistakes":[]}'),quiz=[],pos=0,answered=false,fromLesson=null;
function save(){localStorage.setItem("topik-progress",JSON.stringify(state))}function translatorLink(t,provider,label){const value=encodeURIComponent(String(t||"").trim());const url=provider==="papago"?"https://papago.naver.com/?sk=ko&tk=ja&st="+value:"https://translate.google.com/?sl=ko&tl=ja&text="+value+"&op=translate";return '<a class="translator-link" href="'+url.replace(/&/g,"&amp;")+'" target="_blank" rel="noopener noreferrer">'+label+'</a>'}

const NOTEBOOK_KEY="topik-unknown-words-v1";
function getNotebook(){try{const a=JSON.parse(localStorage.getItem(NOTEBOOK_KEY)||"[]");return Array.isArray(a)?a:[]}catch{return []}}
function toggleNotebook(ko,ja,zh){let a=getNotebook(),i=a.findIndex(w=>w.ko===ko);if(i>=0)a.splice(i,1);else a.push({ko,ja,zh,addedAt:new Date().toISOString()});localStorage.setItem(NOTEBOOK_KEY,JSON.stringify(a));return i<0}
function saveQuizWord(i){const q=quiz[pos],w=q.lexicon.split(";").filter(Boolean)[i].split("|");toggleNotebook(w[0],w[1]||"",w[2]||"");document.querySelectorAll(".notebook-btn").forEach(b=>{if(Number(b.dataset.index)===i)b.textContent=getNotebook().some(x=>x.ko===w[0])?"✓ 保存済み（タップで解除）":"＋ 生詞帳に追加"})}
function showNotebook(){location.href="./notebook.html?view=unknown";return;const a=getNotebook();shell('<div class="card"><h2>📒 生詞帳 / 生词本（'+a.length+'）</h2><p class="muted">文法の解説で保存した単語です。</p>'+(a.length?a.map((w,i)=>'<div style="padding:12px 0;border-bottom:1px solid #e6e9f3"><b>'+escapeHTML(w.ko)+'</b><p>🇯🇵 '+escapeHTML(w.ja)+' · 🇨🇳 '+escapeHTML(w.zh)+'</p><div class="row">'+translatorLink(w.ko,"google","🔊 発音 ↗")+'<button onclick="removeNotebook('+i+')">削除</button></div></div>').join(""):'<p>まだ保存した単語はありません。</p>')+'</div><button onclick="home()">← ホーム</button>')}
function removeNotebook(i){const a=getNotebook();a.splice(i,1);localStorage.setItem(NOTEBOOK_KEY,JSON.stringify(a));showNotebook()}

function shell(s){$("#app").innerHTML=s;scrollTo(0,0)}function vocabProgress(){try{const v=JSON.parse(localStorage.getItem("topik-vocab-v1")||'{"known":[],"review":[]}');return {known:Array.isArray(v.known)?v.known.length:0,review:Array.isArray(v.review)?v.review.length:0}}catch{return {known:0,review:0}}}
function home(){const v=vocabProgress();shell('<div class="card"><h2>안녕하세요! 👋</h2><p>日本語を中心に、中文の説明も使って TOPIK I を学びましょう。</p><div class="row"><button class="primary" onclick="lessons()">📚 文法を学ぶ</button><a class="primary" href="./vocab.html" style="display:inline-block;background:#4654b8;color:white;text-decoration:none;border-radius:12px;padding:11px 14px">🗂️ 単語を学ぶ</a><a href="./notebook.html" class="translator-link">📚 分級単語</a></div></div><div class="card"><h2>📊 学習ダッシュボード</h2><h3>📚 文法</h3><div class="row"><div><span class="stat">'+state.done.length+'</span> / '+data.length+' 項目</div><div>練習 '+state.attempts+' 回 · 正答率 '+(state.attempts?Math.round(state.correct/state.attempts*100):0)+'%</div></div><div style="height:9px;background:#e7e9f7;border-radius:8px;margin:12px 0"><div style="height:100%;width:'+(state.done.length/data.length*100)+'%;background:#4654b8;border-radius:8px"></div></div><h3>🗂️ 単語</h3><div class="row"><div><span class="stat">'+v.known+'</span> / 348 語</div><div>⭐ 復習が必要：'+v.review+' 語</div></div><div style="height:9px;background:#e7e9f7;border-radius:8px;margin:12px 0"><div style="height:100%;width:'+(v.known/348*100)+'%;background:#42a68a;border-radius:8px"></div></div><div class="row"><button onclick="setup()">📝 文法テスト</button><button onclick="showNotebook()">📒 生詞帳</button><a href="./vocab.html" style="display:inline-block;background:#4654b8;color:white;text-decoration:none;border-radius:12px;padding:11px 14px">🔊 単語カード</a></div></div><div class="card"><h2>🔊 音声学習</h2><p>文法例文の発音は Google 翻訳・Papago で確認できます。リンク先で再生してください。</p><p class="muted">進捗は同じブラウザ内に保存され、ホームに戻ると更新されます。</p></div>')}
function lessons(){shell('<div class="card"><h2>📚 文法 '+data.length+' 項目</h2><p class="muted">TOPIK I の基礎文法を学習できます。</p><div class="list">'+data.map(x=>'<button onclick="lesson('+x.id+')">'+(state.done.includes(x.id)?"✅":"📖")+' '+x.id+'. '+x.title+' <span class="muted">— '+x.ja+'</span></button>').join("")+'</div></div>')}
function lesson(id){let x=data[id-1];shell('<div class="card"><div class="muted">文法 '+id+' / '+data.length+'</div><h2>'+x.title+' <small>'+x.ja+'</small></h2><div class="rule">'+x.rule+'</div><h3>例文</h3><div class="ko">'+x.ko+'</div><div class="row">'+translatorLink(x.ko,"google","🔊 Google 翻訳 ↗")+translatorLink(x.ko,"papago","🔊 Papago ↗")+'</div><p>🇯🇵 '+x.j+'</p><p class="zh">🇨🇳 '+x.zh+'</p><h3>単語・表現の発音</h3><div class="row">'+x.words.map(w=>''+translatorLink(w,"google","🔊 "+w+" (Google) ↗")+translatorLink(w,"papago","Papago ↗")+'').join("")+'</div><div class="sp"></div><div class="row"><button class="primary" onclick="mark('+id+')">'+(state.done.includes(id)?"✓ 学習済み":"✓ 学習済みにする")+'</button><button onclick="startQuiz(10,'+id+')">この文法を練習</button></div></div><div class="row"><button onclick="lessons()">← 一覧</button>'+(id<data.length?'<button onclick="lesson('+(id+1)+')">次へ →</button>':'')+'</div>')}
function mark(id){if(!state.done.includes(id))state.done.push(id);save();lesson(id)}
function setup(){shell('<div class="card"><h2>📝 反復練習</h2><p>毎回問題・選択肢をシャッフルします。何度でも練習できます。</p><label>問題数 <select id="count"><option>10</option><option selected>20</option><option>30</option><option>50</option><option>100</option></select></label><div class="sp"></div><div class="row"><button class="primary" onclick="startQuiz(Number(\x27\x27+document.getElementById(\x27count\x27).value))">全範囲ランダム</button><button onclick="startQuiz(Number(document.getElementById(\x27count\x27).value),null,true)">❌ 間違い復習</button></div></div>')}

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function unique(a){return [...new Set(a)]}
function escapeHTML(t){return String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
const special={
1:{base:"학생",right:"학생이에요",wrong:["학생예요","학생아요","학생어요"],ruleZh:"학생 的最后一个音节 생 有收音 ㅇ，因此接 이에요；没有收音的名词才接 예요。",ruleJa:"학생 の最後の音節 생 にはパッチム ㅇ があるため 이에요 を使います。パッチムがない名詞には 예요 を使います。",bad:"친구이에요",badFix:"친구예요"},
2:{base:"학생",right:"학생입니다",wrong:["학생예요","학생입니까","학생이에"],ruleZh:"입니다 是名词后的正式礼貌陈述形式；입니까 是疑问形式。",ruleJa:"입니다 は名詞につくフォーマルな丁寧体の平叙形です。입니까 は疑問形です。",bad:"학생입니까.",badFix:"학생입니다."},

4:{base:"학생",right:"학생이",wrong:["학생가","학생은","학생를"],ruleZh:"학생 有收音，主格助词用 이；无收音用 가。은 是主题助词。",ruleJa:"학생 はパッチムがあるので主格助詞 이 を使います。パッチムがなければ 가。은 は主題の助詞です。",bad:"학생가",badFix:"학생이"},

function wordNotes(q){const bank=window.TOPIK_LEXICON||[];const book=window.topikBookRead?topikBookRead():{};const entries=(q.lexicon||"").split(";").filter(Boolean).map(v=>v.split("|"));return entries.length?'<div style="margin-top:12px;border-top:1px solid #cbd0e4;padding-top:10px"><b>📖 新出単語 / 生词</b>'+entries.map(([ko,ja,zh])=>{const found=bank.find(w=>w.ko===ko),level=found?found.level:1;return '<div class="row" style="justify-content:space-between;border-top:1px solid #ddd;padding:9px 0"><span><b>'+escapeHTML(ko)+'</b> <small>'+level+'級</small><br>🇯🇵 '+escapeHTML(ja)+' · 🇨🇳 '+escapeHTML(zh)+'</span><button data-ko="'+escapeHTML(ko)+'" onclick="saveUnknown(this)">'+(book[ko]?'✓ 保存済み':'⭐ 生詞帳に追加')+'</button></div>'}).join("")+'<a href="./notebook.html?view=unknown">📒 生詞帳を見る →</a></div>':""}

function choicesFor(correct,distractors){return shuffle(unique([correct,...distractors.filter(x=>x!==correct)]).slice(0,4))}
function makeQ(x,forced){
 const type=forced||types[Math.floor(Math.random()*types.length)],sp=special[x.id],other=shuffle(data.filter(v=>v.id!==x.id));
 const explanationZh=sp?sp.ruleZh:"本题考查「"+x.title+"」（"+x.ja+"）。规则："+x.rule+"。例句："+x.ko+"（"+x.zh+"）";
 const explanationJa=sp?sp.ruleJa:"この問題は「"+x.title+"」（"+x.ja+"）の使い方を確認します。ルール："+x.rule+"。例文："+x.ko+"（"+x.j+"）";
 let prompt="",correct="",choices=[],order=null,kind=type,extraZh="",extraJa="";
 const match=x.words.find(w=>x.ko.includes(w))||x.ko.replace(/[.!?]$/,"").split(" ").slice(-1)[0];
 const entry=exerciseFor(x.id),sentence=entry[1],target=entry[2],wrong=entry.slice(3,6),lexicon=entry[6];
 if(type==="穴埋め"){
   prompt="【穴埋め】文脈に合う形を選んでください。\n"+sentence.replace(target,"＿＿＿")+"\n🇯🇵 "+x.ja+" ／ "+x.title;
   correct=target;choices=shuffle([target,...wrong]);extraZh="完整例句："+sentence;extraJa="完成文："+sentence;
 }else if(type==="活用"){
   prompt="【活用】次の文を完成させる正しい形は？\n"+sentence.replace(target,"＿＿＿")+"\n文法："+x.title;
   correct=target;choices=shuffle([target,...wrong]);extraZh="完整例句："+sentence;extraJa="完成文："+sentence;
 }else if(type==="間違い探し"){
   prompt="【間違い探し】次の文の誤った表現を正しく直してください。\n"+sentence.replace(target,wrong[0]);
   correct=target;choices=shuffle([target,...wrong]);extraZh="错误形式："+wrong[0]+"；正确形式："+target+"。";extraJa="誤った形："+wrong[0]+"。正しい形："+target+"。";
 }else if(type==="語順"){
   prompt="【語順】語句を正しい順番に並べましょう。\n🇯🇵 "+x.j;
   const clean=sentence.replace(/[.!?]$/,""),tokens=clean.split(/\s+/);
   if(tokens.length<2){kind="穴埋め";prompt="【穴埋め】空欄に入る形は？\n"+sentence.replace(target,"＿＿＿");correct=target;choices=shuffle([target,...wrong])}
   else {order=tokens;correct=clean;choices=[];extraZh="正确句子："+sentence+"。注意助词、词尾和句子顺序。";extraJa="正しい文："+sentence+"。助詞・語尾・語順を確認しましょう。"}
 }else if(type==="韓日翻訳"){prompt="【韓日翻訳】次の韓国語の意味は？\n"+x.ko;correct=x.j;choices=choicesFor(correct,other.map(v=>v.j))}
 else if(type==="日韓翻訳"){prompt="【日韓翻訳】「"+x.j+"」に合う韓国語は？";correct=x.ko;choices=choicesFor(correct,other.map(v=>v.ko))}
 else {prompt="【文法の意味】「"+x.title+"」の意味は？";correct=x.ja;choices=choicesFor(correct,other.map(v=>v.ja))}
 return {x,kind,prompt,correct,choices,order,explanationZh,explanationJa,extraZh,extraJa,lexicon};
}
function startQuiz(n=20,id=null,wrong=false){let pool=id?[data[id-1]]:wrong?data.filter(x=>state.mistakes.includes(x.id)):data;if(!pool.length){alert("復習する間違いはありません。");return}quiz=Array.from({length:n},(_,i)=>makeQ(pool[Math.floor(Math.random()*pool.length)],types[i%types.length]));quiz=shuffle(quiz);pos=0;fromLesson=id;renderQ()}
let selectedOrder=[];
function renderQ(){answered=false;selectedOrder=[];if(pos>=quiz.length){shell('<div class="card"><h2>🎉 お疲れさまでした！</h2><p>今回の練習が終わりました。</p><div class="row"><button class="primary" onclick="startQuiz('+quiz.length+','+fromLesson+')">🔁 もう一度</button><button onclick="setup()">別の練習</button></div></div>');return}let q=quiz[pos];let options=q.order?'<p class="muted">単語を順番にタップしてください。</p><div class="rule" id="builtOrder" style="min-height:48px">（ここに文を作成）</div><div class="row" id="wordBank">'+shuffle(q.order.map((w,i)=>({w,i}))).map(o=>'<button data-word="'+o.i+'" onclick="pickWord('+o.i+')">'+escapeHTML(o.w)+'</button>').join("")+'</div><div class="row" style="margin-top:12px"><button onclick="selectedOrder=[];updateOrder()">↺ やり直す</button><button class="primary" onclick="answerOrder()">回答する</button></div>':'<div id="options">'+q.choices.map((c,i)=>'<button class="answer" onclick="answer('+i+')">'+String.fromCharCode(65+i)+'. '+escapeHTML(c)+'</button>').join("")+'</div>';shell('<div class="card"><p class="muted">問題 '+(pos+1)+' / '+quiz.length+' · '+escapeHTML(q.kind)+'</p><h2 style="white-space:pre-line">'+escapeHTML(q.prompt)+'</h2><div class="row">'+translatorLink(q.x.ko,"google","🔊 Google 翻訳 ↗")+translatorLink(q.x.ko,"papago","🔊 Papago ↗")+'</div><div class="sp"></div>'+options+'<div id="feedback"></div></div>')}
function pickWord(i){if(answered||selectedOrder.includes(i))return;selectedOrder.push(i);updateOrder()}
function updateOrder(){let q=quiz[pos];document.querySelector("#builtOrder").textContent=selectedOrder.length?selectedOrder.map(i=>q.order[i]).join(" "):"（ここに文を作成）";document.querySelectorAll("#wordBank button").forEach(b=>{b.disabled=selectedOrder.includes(Number(b.dataset.word))})}
function answerOrder(){if(answered)return;if(selectedOrder.length!==quiz[pos].order.length){alert("すべての語句を選んでください。");return}finishAnswer(selectedOrder.map(i=>quiz[pos].order[i]).join(" "))}
function answer(i){if(answered)return;finishAnswer(quiz[pos].choices[i],i)}
function finishAnswer(given,choiceIndex){if(answered)return;answered=true;let q=quiz[pos],ok=given===q.correct;state.attempts++;if(ok)state.correct++;else if(!state.mistakes.includes(q.x.id))state.mistakes.push(q.x.id);if(ok)state.mistakes=state.mistakes.filter(id=>id!==q.x.id);save();document.querySelectorAll(".answer").forEach((b,j)=>{b.disabled=true;if(q.choices[j]===q.correct)b.classList.add("correct");else if(j===choiceIndex)b.classList.add("wrong")});document.querySelectorAll("#wordBank button").forEach(b=>b.disabled=true);const detailZh=ok?"回答正确！"+q.explanationZh:"你选择了「"+given+"」，正确答案是「"+q.correct+"」。"+q.explanationZh;const detailJa=ok?"正解です！"+q.explanationJa:"選んだ答えは「"+given+"」、正解は「"+q.correct+"」です。"+q.explanationJa;$("#feedback").innerHTML='<div class="rule" style="margin-top:14px;background:'+(ok?"#e6f7ed":"#fff0e8")+'"><h3>'+(ok?"✅ 正解！":"❌ 不正解")+'</h3><p><b>正解：</b>'+escapeHTML(q.correct)+'</p><p><b>🇨🇳 中文解析</b><br>'+escapeHTML(detailZh+" "+q.extraZh)+'</p><p><b>🇯🇵 日本語解説</b><br>'+escapeHTML(detailJa+" "+q.extraJa)+'</p>'+wordNotes(q)+'</div><div class="sp"></div><button class="primary" onclick="pos++;renderQ()">次の問題 →</button>'}
function stats(){shell('<div class="card"><h2>📊 学習記録</h2><p>学習済み：<b>'+state.done.length+'/'+data.length+'</b></p><p>回答数：<b>'+state.attempts+'</b></p><p>正答率：<b>'+(state.attempts?Math.round(state.correct/state.attempts*100):0)+'%</b></p><p>復習対象：<b>'+state.mistakes.length+'</b></p><div class="row"><button onclick="startQuiz(20,null,true)">❌ 間違いを復習</button><button onclick="exportData()">📤 記録を保存</button></div></div><div class="card"><h3>データ管理</h3><p class="muted">記録はこのブラウザ内に保存されます。Safariのデータ削除で消える場合があります。</p><input type="file" accept="application/json" onchange="importData(event)"><div class="sp"></div><button onclick="if(confirm(\x27記録を消去しますか？\x27)){localStorage.removeItem(\x27topik-progress\x27);location.reload()}">記録をリセット</button></div>')}
function exportData(){let a=document.createElement("a"),b=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});a.href=URL.createObjectURL(b);a.download="topik-progress.json";a.click();URL.revokeObjectURL(a.href)}
function importData(e){let f=e.target.files[0];if(!f)return;f.text().then(t=>{try{let o=JSON.parse(t);if(!Array.isArray(o.done)||!Array.isArray(o.mistakes))throw Error();state=o;save();stats()}catch{alert("読み込めませんでした")}})}
